<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
   <h2 class="tituloInicio">Inicio de sesión</h2>
  <div>
    <label for="exampleInputEmail1" class="form-label">Correo electronico</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" formControlName="email">
    <div *ngIf="email?.invalid && (email?.touched || email?.dirty)" class="text-danger">
      <small *ngIf="email?.errors?.['required']">El correo es obligatorio</small>
      <small *ngIf="email?.errors?.['email']">Ingrese un correo válido</small>
    </div>
  </div>

  <div>
    <label for="exampleInputPassword1" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="exampleInputPassword1" formControlName="password">
    <div *ngIf="password?.invalid && (password?.touched || password?.dirty)" class="text-danger">
      <small *ngIf="password?.errors?.['required']">La contraseña es obligatoria</small>
      <small *ngIf="password?.errors?.['minlength']">Mínimo 8 caracteres</small>
      <small *ngIf="password?.errors?.['maxlength']">Máximo 20 caracteres</small>
    </div>
    <div class="links">
        <small>
          <a routerLink="/register" class="link">Registrate aquí</a>
        </small>
        <br>
        <small>
          <a routerLink="/forgot-password" class="link">Cambiar contraseña</a>
        </small>
    </div>
  </div>
  <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">Iniciar sesión</button>
</form>
