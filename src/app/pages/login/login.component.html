<form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
  <h2 class="tituloInicio">Inicio de sesión</h2>
  <!-- Email -->
  <div class="mb-3">
    <label for="email" class="form-label">Correo electrónico</label>
    <input type="email" class="form-control" id="email" 
           name="email" [(ngModel)]="credentials.email"
           required email #email="ngModel"
           placeholder="example@example.com">
           
    <div *ngIf="email.invalid && (email.touched || email.dirty)" class="text-danger">
      <small *ngIf="email.errors?.['required']">El correo es obligatorio.</small>
      <small *ngIf="email.errors?.['email']">Ingrese un correo válido.</small>
    </div>
  </div>
  <!-- Password -->
  <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="password" 
          name="password" [(ngModel)]="credentials.password"
          required minlength="8" maxlength="20" #password="ngModel"
          placeholder="********">
           
    <div *ngIf="password.invalid && (password.touched || password.dirty)" class="text-danger">
      <small *ngIf="password.errors?.['required']">La contraseña es obligatoria.</small>
      <small *ngIf="password.errors?.['minlength']">Mínimo 8 caracteres.</small>
    </div>
    <div class="links">
        <small>
          <a routerLink="/register" class="link">Registrate aquí</a>
        </small>
        <br>
        <small>
          <a routerLink="/forgot-password" class="link">Cambiar contraseña</a>
        </small>
    </div>
  </div>
  <button type="submit" onSubmit() class="btn btn-primary">Inicia sesión</button>
</form>
