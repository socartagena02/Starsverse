<form [formGroup]="changePassword" (ngSubmit)="sendCode()">
   <h2 class="changePassword">¿Olvidaste tu contraseña?</h2>
  <div>
    <label for="exampleInputEmail1" class="form-label">Correo electronico</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" formControlName="email">
    <div *ngIf="email?.invalid && (email?.touched || email?.dirty)" class="text-danger">
      <small *ngIf="email?.errors?.['required']">El correo es obligatorio</small>
      <small *ngIf="email?.errors?.['email']">Ingrese un correo válido</small>
    </div>
  </div>
  <button type="submit" [disabled]="changePassword.invalid" class="btn btn-primary">Enviar código</button>
  <div class="mt-3">
    <div *ngIf="loading" class="alert alert-info">Enviando código...</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  </div> 
</form>
